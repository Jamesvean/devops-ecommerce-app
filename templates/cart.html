{% extends 'base.html' %}{% block content %}<h1>Your cart</h1>{% if items %}<div class="panel">{% for item in items %}<p>{{ item.emoji }} {{ item.name }} × {{ item.quantity }} <strong>{{ item.subtotal|gbp }}</strong></p>{% endfor %}<h2>Total: {{ total|gbp }}</h2><form method="post" action="{{ url_for('checkout') }}"><button type="submit">Place demo order</button></form></div>{% else %}<p>Your cart is empty. <a href="{{ url_for('home') }}">Browse products</a>.</p>{% endif %}{% endblock %}
