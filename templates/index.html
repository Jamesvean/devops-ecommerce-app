{% extends 'base.html' %}{% block content %}<section class="hero"><h1>Welcome to DevOps Shop</h1><p>A demo e-commerce application built to practise CI/CD and cloud deployment.</p></section><h2>Featured products</h2><div class="grid">{% for product in products %}<article class="product"><div class="emoji">{{ product.emoji }}</div><h3>{{ product.name }}</h3><p class="price">{{ product.price_pence|gbp }}</p><form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button type="submit">Add to cart</button></form></article>{% endfor %}</div>{% endblock %}
