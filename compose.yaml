services:
  ecommerce:
    build: .
    image: devops-ecommerce:v1
    ports:
      - "127.0.0.1:5001:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_PATH: /app/data/orders.db
    volumes:
      - ecommerce_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ecommerce_data:
